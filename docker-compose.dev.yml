services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    volumes:
      - ./.env:/app/.env
      - ./config:/app/config
      - ./e2e-test-folder:/app/e2e-test-folder
    environment:
      TALKARR_SECRET: verysecret
    depends_on:
      - db

volumes:
  postgres_data_dev:
